<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Slides</div>
      <div class="thumb-list" id="thumbList"></div>
    </aside>

    <main class="viewer">
      <header class="topbar">
        <button id="toggleSidebar" class="icon-btn" title="Toggle slide list">☰</button>
        <div class="counter"><span id="currentIndex">1</span> / <span id="totalCount">1</span></div>
        <div class="spacer"></div>
        <button id="prevBtn" class="icon-btn" title="Previous (←)">‹</button>
        <button id="nextBtn" class="icon-btn" title="Next (→)">›</button>
        <button id="fullscreenBtn" class="icon-btn" title="Fullscreen">⛶</button>
      </header>

      <div class="stage" id="stage">
        <img id="slideImage" src="" alt="Slide">
      </div>
    </main>
  </div>

<script src="script.js"></script>
</body>
</html>
