<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Two-layer book stage: back = destination, front = current (gets flipped) -->
  <div class="book-stage" id="bookStage">
    <div class="book-layer" id="backLayer">
      <img id="backImage" src="" alt="" draggable="false">
    </div>
    <div class="book-layer front" id="frontLayer">
      <img id="frontImage" src="" alt="" draggable="false">
    </div>
  </div>

  <!-- Side navigation arrows -->
  <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <!-- Bottom bar: progress line + controls -->
  <div class="bottom-bar" id="bottomBar">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="bottom-controls">
      <button class="ctrl-btn" id="thumbToggle" aria-label="View all slides" title="All slides">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
      <div class="counter"><span id="currentNum">1</span><span class="sep"> / </span><span id="totalNum">1</span></div>
      <button class="ctrl-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen">
        <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <svg id="fsIconCollapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
      </button>
    </div>
  </div>

  <!-- Thumbnail panel (slides up from bottom) -->
  <div class="thumb-panel" id="thumbPanel" aria-hidden="true">
    <div class="panel-handle"></div>
    <div class="thumb-panel-header">
      <span class="thumb-panel-title">All Slides</span>
      <button class="ctrl-btn thumb-close-btn" id="thumbClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <noscript>
    <p style="font-family:sans-serif;text-align:center;padding:60px 20px;color:#eee;background:#000;min-height:100vh">
      Please enable JavaScript to view this portfolio.
    </p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
