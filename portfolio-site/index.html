<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Backdrop: tap outside sidebar to close on mobile/tablet -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app">
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-header">
        <span>Slides</span>
        <button id="closeSidebar" class="icon-btn sidebar-close" aria-label="Close slide list">&#10005;</button>
      </div>
      <div class="thumb-list" id="thumbList"></div>
    </aside>

    <main class="viewer">
      <header class="topbar">
        <button id="toggleSidebar" class="icon-btn" aria-label="Toggle slide list" title="Toggle slide list">&#9776;</button>
        <div class="counter"><span id="currentIndex">1</span> / <span id="totalCount">1</span></div>
        <div class="spacer"></div>
        <button id="prevBtn" class="icon-btn topbar-nav" aria-label="Previous slide" title="Previous (Left arrow key)">&#8249;</button>
        <button id="nextBtn" class="icon-btn topbar-nav" aria-label="Next slide" title="Next (Right arrow key)">&#8250;</button>
        <button id="fullscreenBtn" class="icon-btn" aria-label="Toggle fullscreen" title="Fullscreen">
          <svg id="fsIconExpand" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          <svg id="fsIconCollapse" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>
        </button>
      </header>

      <div class="stage" id="stage">
        <!-- Overlay nav arrows: visible on touch devices, hover-only on desktop -->
        <button id="stagePrevBtn" class="stage-nav stage-nav-prev" aria-label="Previous slide">&#8249;</button>
        <button id="stageNextBtn" class="stage-nav stage-nav-next" aria-label="Next slide">&#8250;</button>
        <img id="slideImage" src="" alt="Slide" draggable="false">
      </div>
    </main>
  </div>

  <noscript>
    <style>.app,.sidebar-backdrop{display:none}</style>
    <p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#ccc">
      Please enable JavaScript to view this portfolio.
    </p>
  </noscript>

<script src="script.js"></script>
</body>
</html>
